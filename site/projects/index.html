<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects · Chipbox</title>
<style>
  :root { --bg:#0e0e12; --panel:#181820; --ink:#e8e8ee; --dim:#8a8a9a; --red:#eb4034; --blue:#46aaff; --green:#50dc78; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  main { max-width:680px; margin:0 auto; padding:32px 16px 72px; }
  nav { display:flex; flex-wrap:wrap; gap:6px 18px; margin-bottom:26px; font-size:14px; }
  h1 { font-size:34px; margin:0 0 20px; letter-spacing:.02em; }
  h2 { font-size:18px; margin:34px 0 12px; letter-spacing:.04em; }
  .tag { display:inline-block; padding:2px 10px; background:var(--red); color:#fff; font-size:13px; letter-spacing:.12em; vertical-align:middle; margin-left:10px; }
  p { margin:0 0 12px; }
  a { color:var(--blue); }
  h1 a { color:inherit; text-decoration:none; }
  button, .btn { font:inherit; font-size:14px; font-weight:700; background:var(--ink); color:var(--bg); border:0; padding:8px 16px; cursor:pointer; }
  button.alt, .btn.alt { background:var(--panel); color:var(--ink); border:1px solid #33333f; }
  a.btn { display:inline-block; text-decoration:none; }
  button.warn { background:var(--red); color:#fff; }
  button:disabled { opacity:.3; cursor:default; }
  .row { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding:12px 14px; background:var(--panel); margin-bottom:6px; }
  .row .n { width:2ch; color:var(--dim); }
  .row .what { flex:1 1 180px; min-width:0; }
  .row .what small { display:block; color:var(--dim); font-size:13px; }
  .row.open { outline:1px solid var(--green); }
  .btns { display:flex; flex-wrap:wrap; gap:6px; }
  select { font:inherit; font-size:14px; background:var(--bg); color:var(--ink); border:1px solid #33333f; padding:7px 8px; }
  #status { margin:16px 0; min-height:1.55em; }
  #bar { width:100%; height:6px; display:none; }
  .small { color:var(--dim); font-size:14px; }
  input[type=file] { display:none; }
</style>
</head>
<body>
<main>
  <nav><a href="../">Home</a><a href="../manual/">Tutorials</a><a href="../guide/">Manual</a><a href="../play/">Play online</a><a href="../cheatsheet/">Cheat sheet</a><a href="../install.html">Install</a></nav>
  <h1><a href="../">Chipbox</a><span class="tag">PROJECTS</span></h1>
  <p>Save your projects, load someone else's, or try our samples.</p>
  <p><button id="connect">Connect the FM-1</button></p>
  <progress id="bar" max="100" value="0"></progress>
  <p id="status"></p>

  <div id="mine" hidden>
    <h2>On your FM-1</h2>
    <div id="slots"></div>
    <p class="btns" style="margin-top:14px"><button id="backup" class="alt">Back up all</button> <button id="restore" class="alt">Restore a backup</button></p>
  </div>

  <h2>Samples</h2>
  <div id="samples"></div>
  <input type="file" id="pick" accept=".chipbox,application/json">
</main>
<script type="module" src="../js/projects.js"></script>
</body>
</html>
