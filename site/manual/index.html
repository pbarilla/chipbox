<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutorials · Chipbox</title>
<style>
  :root { --bg:#0e0e12; --panel:#181820; --ink:#e8e8ee; --dim:#8a8a9a; --red:#eb4034; --green:#a8cd1c; --blue:#46aaff; --line:#23232e; color-scheme:dark; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  main { max-width:820px; margin:0 auto; padding:40px 16px 80px; }
  nav { display:flex; flex-wrap:wrap; gap:8px 20px; margin:0 0 28px; }
  a { color:var(--blue); }
  h1 { font-size:44px; line-height:1.1; margin:0 0 8px; letter-spacing:.02em; }
  h1 a { color:inherit; text-decoration:none; }
  .tag { display:inline-block; padding:2px 10px; background:var(--red); color:#fff; font-size:13px; letter-spacing:.12em; vertical-align:middle; margin-left:10px; }
  .intro { color:var(--dim); margin:0 0 40px; }
  .step { padding:36px 0 22px; border-top:1px solid var(--line); }
  .step h2 { margin:0 0 14px; display:flex; align-items:center; gap:14px; font-size:20px; font-weight:700; }
  .step h2 b { display:inline-grid; place-items:center; min-width:34px; height:34px; padding:0 8px; background:var(--ink); color:var(--bg); font-size:18px; }
  .item { padding:8px 0 12px; }
  .t { display:flex; gap:12px; min-width:0; }
  .t::before { content:"•"; color:var(--dim); flex:none; }
  .t > div { min-width:0; }
  .pic { margin:10px 0 4px 24px; max-width:620px; }
  img { display:block; width:100%; height:auto; background:var(--panel); border-radius:12px; }
  .block { margin:6px 0 6px 24px; }
  .block p { margin:0 0 10px; }
  pre { font:inherit; font-size:13px; background:var(--panel); padding:12px 14px; overflow-x:auto; margin:6px 0; line-height:1.75; border-radius:8px; }
  code { font:inherit; background:#fff; color:var(--bg); padding:1px 6px; border-radius:4px; }
  .slow { display:inline-block; padding:0 8px; border-radius:4px; background:var(--green); color:var(--bg); animation:sloow 2.8s cubic-bezier(.4,0,.2,1) infinite alternate; }
  @keyframes sloow { from { letter-spacing:0; } to { letter-spacing:.28em; } }
  @media (prefers-reduced-motion:reduce) { .slow { animation:none; } }
  @media (max-width:760px) { h1 { font-size:34px; } .pic, .block { margin-left:0; } }
</style>
</head>

<main>

  </section>
</main>
</body>
</html>
